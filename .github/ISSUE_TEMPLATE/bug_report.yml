name: 🐛 Bug Report
description: Create a report to help us improve Im Charts
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the information below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open chart with `TradingChart(...)`
        2. Select 'Trendline'
        3. Tap canvas ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Flutter & OS Environment
      description: Output of `flutter --version` and target OS (macOS, Android, iOS, Web, Windows).
      placeholder: Flutter 3.24.3, macOS Sequoia, Web / Chrome
    validations:
      required: true
