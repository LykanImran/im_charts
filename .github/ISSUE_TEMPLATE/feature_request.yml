name: 💡 Feature Request
description: Suggest an idea or new indicator / drawing instrument for Im Charts
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new indicator, drawing instrument, or performance enhancement? Let's discuss it!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a specific financial or charting use case?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
